<html lang="ja">
<head>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f7f7f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh}
button{font:inherit}
#app{max-width:720px;margin:0 auto;min-height:100vh;background:#fff}
header{padding:28px 18px 14px;text-align:center}
h1{font-size:28px;letter-spacing:.04em;margin:0 0 8px}
.sub{font-size:13px;color:#666;line-height:1.6}
.progress-wrap{padding:0 18px 12px}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:7px}
.progress{height:7px;background:#eee;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#111;transition:width .25s}
#game{padding:8px 14px 30px}
.question{text-align:center;font-weight:700;font-size:17px;margin:8px 0 14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:0;background:#fff;border-radius:16px;overflow:hidden;padding:0;box-shadow:0 2px 14px rgba(0,0,0,.12);cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:active{transform:scale(.975);box-shadow:0 1px 7px rgba(0,0,0,.16)}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}
.name{padding:12px 8px 14px;font-size:17px;font-weight:800}
.vs{position:absolute;left:50%;transform:translateX(-50%);margin-top:calc(50vw - 26px);width:38px;height:38px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hint{text-align:center;color:#888;font-size:12px;margin-top:13px}
#result{display:none;padding:10px 16px 36px}
.result-title{text-align:center;font-size:25px;font-weight:900;margin:8px 0 4px}
.result-sub{text-align:center;color:#666;font-size:13px;margin-bottom:18px}
.top9{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rank-card{position:relative;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.rank-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.rank{position:absolute;left:7px;top:7px;width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.rank-name{padding:9px 6px 11px;text-align:center;font-size:14px;font-weight:800}
.actions{display:flex;gap:9px;margin:18px 0 10px}
.action{flex:1;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 8px;font-weight:700}
.action.primary{background:#111;color:#fff;border-color:#111}
details{margin-top:14px;border-top:1px solid #eee;padding-top:14px}
summary{cursor:pointer;font-weight:800;padding:7px 0}
.full-rank{margin-top:10px}
.row{display:grid;grid-template-columns:38px 56px 1fr 62px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eee;font-size:13px}
.row img{width:56px;height:70px;object-fit:cover;border-radius:8px;background:#eee}
.num{font-weight:900;text-align:center}
.rating{text-align:right;color:#777;font-variant-numeric:tabular-nums}
.credit{margin-top:22px;text-align:center;font-size:11px;line-height:1.6;color:#888}
.credit a{color:inherit}
@media(max-width:430px){
  header{padding-top:24px}
  h1{font-size:25px}
  .cards{gap:8px}
  .name{font-size:15px}
  .vs{margin-top:calc(50vw - 25px)}
}
</style>
</head>

tertainment.co.jp/wp-content/uploads/2026/01/71fc88350755956a7a03eba798471a8e.jpg"},{"name":"なぎさ","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/01/82e73169f4761d0904ed7e454a2b9f86.jpg"},{"name":"フマル","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/05/48c4b41e7b2e0139609ee2d510fc4c58.jpg"},{"name":"りゅうせい","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/07/UnTitle_RYUSEI.jpg"},{"name":"あかね","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/07/UnTitle_AKANE.jpg"},{"name":"りお","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/07/UnTitle_RIO.jpg"},{"name":"なつ","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/07/UnTitle_NATSU.jpg"},{"name":"禊","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/413a4e9aeb56b757c23382dfa3a1a1cd.jpg"},{"name":"タイ・マイ","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/868fd6931f97dde33e896e1a918e4034.jpg"},{"name":"梅","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/18db267123ff54b809538bc3599a733f.jpg"},{"name":"なつめ","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/cab3d41d6708d5afd31dab7d7c4ee733.jpg"},{"name":"よきき","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/cc4ad2392d641e8b79b6a811bcc9c8ae.jpg"},{"name":"りゅーと","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/2_ryuto.jpg"},{"name":"かぐや","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/3_kaguya.jpg"},{"name":"れお","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/4_reo.jpg"},{"name":"あさと","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/5_asato.jpg"},{"name":"しの","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/6_shino.jpg"},{"name":"そらん","image":"https://rindo-entertainment.co.jp/wp-content/uploads/2026/09/7_soran.jpg"}];
const TOTAL_COMPARISONS = 120;
const STORAGE_KEY = "rindo-sukigao9-v1";

let state = null;

function freshState(){
  return {
    ratings: Object.fromEntries(TALENTS.map((_,i)=>[i,1000])),
    wins: Object.fromEntries(TALENTS.map((_,i)=>[i,0])),
    games: Object.fromEntries(TALENTS.map((_,i)=>[i,0])),
    comparisons: 0,
    queue: [],
    current: null,
    seed: Math.random()
  };
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load(){
  try {
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(x && x.ratings && x.comparisons < TOTAL_COMPARISONS) return x;
  } catch(e){}
  return freshState();
}

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makePair(a,b){ return [a,b]; }

function initialQueue(){
  let ids=shuffle([...TALENTS.keys()]);
  const q=[];
  while(ids.length>=2) q.push(makePair(ids.pop(),ids.pop()));
  return q;
}

function adaptivePair(){
  // 比較回数の少ない人を優先し、同程度のレーティング同士を比較。
  const candidates=[...TALENTS.keys()].sort((a,b)=>state.games[a]-state.games[b] || state.ratings[a]-state.ratings[b]);
  const pool=candidates.slice(0,Math.min(24,candidates.length));
  let best=null, bestDiff=Infinity;
  for(let i=0;i<pool.length;i++) for(let j=i+1;j<pool.length;j++){
    const a=pool[i],b=pool[j];
    const diff=Math.abs(state.ratings[a]-state.ratings[b]);
    if(diff<bestDiff){bestDiff=diff;best=[a,b];}
  }
  return best || [shuffle([...TALENTS.keys()])[0],shuffle([...TALENTS.keys()])[1]];
}

function nextPair(){
  if(state.queue && state.queue.length) return state.queue.shift();
  return adaptivePair();
}

function eloUpdate(winner,loser){
  const K=32;
  const rw=state.ratings[winner], rl=state.ratings[loser];
  const expected=1/(1+Math.pow(10,(rl-rw)/400));
  state.ratings[winner]=rw+K*(1-expected);
  state.ratings[loser]=rl+K*(0-expected);
  state.wins[winner]++;
  state.games[winner]++;
  state.games[loser]++;
}

function renderProgress(){
  const n=Math.min(state.comparisons+1,TOTAL_COMPARISONS);
  document.getElementById("progressText").textContent=`比較 ${n} / ${TOTAL_COMPARISONS}`;
  document.getElementById("progressBar").style.width=(state.comparisons/TOTAL_COMPARISONS*100)+"%";
}

function renderPair(){
  renderProgress();
  const pair=nextPair();
  state.current=pair;
  const cards=document.getElementById("cards");
  cards.innerHTML="";
  pair.forEach((id)=>{
    const b=document.createElement("button");
    b.className="card";
    b.innerHTML=`<img src="${TALENTS[id].image}" alt="${TALENTS[id].name}" loading="eager" referrerpolicy="no-referrer"><div class="name">${TALENTS[id].name}</div>`;
    b.addEventListener("click",()=>choose(id));
    cards.appendChild(b);
  });
}

function choose(winner){
  const pair=state.current;
  if(!pair || !pair.includes(winner)) return;
  const loser=pair[0]===winner?pair[1]:pair[0];
  eloUpdate(winner,loser);
  state.comparisons++;
  state.current=null;
  save();
  if(state.comparisons>=TOTAL_COMPARISONS) showResult();
  else renderPair();
}

function ranked(){
  return [...TALENTS.keys()].sort((a,b)=>
    state.ratings[b]-state.ratings[a] ||
    state.wins[b]-state.wins[a] ||
    state.games[a]-state.games[b] ||
    a-b
  );
}

function showResult(){
  save();
  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="block";
  const order=ranked();
  document.getElementById("top9").innerHTML=order.slice(0,9).map((id,i)=>`
    <div class="rank-card">
      <div class="rank">${i+1}</div>
      <img src="${TALENTS[id].image}" alt="${TALENTS[id].name}" referrerpolicy="no-referrer">
      <div class="rank-name">${TALENTS[id].name}</div>
    </div>`).join("");
  document.getElementById("fullRank").innerHTML=order.map((id,i)=>`
    <div class="row">
      <div class="num">${i+1}</div>
      <img src="${TALENTS[id].image}" alt="${TALENTS[id].name}" loading="lazy" referrerpolicy="no-referrer">
      <div><b>${TALENTS[id].name}</b><br><span style="color:#888">${state.games[id]}回比較・${state.wins[id]}勝</span></div>
      <div class="rating">${state.ratings[id].toFixed(1)}</div>
    </div>`).join("");
}

function restart(){
  localStorage.removeItem(STORAGE_KEY);
  state=freshState();
  state.queue=initialQueue();
  document.getElementById("game").style.display="block";
  document.getElementById("result").style.display="none";
  renderPair();
}

document.getElementById("restart").addEventListener("click",restart);
document.getElementById("share").addEventListener("click",async()=>{
  const order=ranked().slice(0,9);
  const text="RINDO 好き顔9選\n"+order.map((id,i)=>`${i+1}. ${TALENTS[id].name}`).join("\n");
  if(navigator.share){
    try{await navigator.share({title:"RINDO 好き顔9選",text,url:location.href});}catch(e){}
  }else{
    try{await navigator.clipboard.writeText(text+"\n"+location.href);alert("結果をコピーしました！");}
    catch(e){alert(text);}
  }
});

state=load();
if(!state.queue || !state.queue.length) state.queue=initialQueue();
renderPair();
</script>
</body>
</html>
